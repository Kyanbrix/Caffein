services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: caffeine
    restart: "no"
    # Java takes up to 40% of this (JAVA_TOOL_OPTIONS in the Dockerfile); the rest
    # is for Node + headless Chromium during renders.
    mem_limit: 1g
    # Docker's default 64 MB /dev/shm can crash Chromium on large pages.
    shm_size: 256m
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - WELCOME_WEBHOOK=${WELCOME_WEBHOOK}
      - OPENAI_KEY=${OPENAI_KEY}
      - TAVILY_KEY=${TAVILY_KEY}
      - GOOGLE_CSE_ID=${SEARCH_ENGINE_ID}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LAST_FM_API_KEY=${LAST_FM_API_KEY}
      - LAST_FM_SECRET_KEY=${LAST_FM_SECRET_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - GEO_API=${GEO_API}
      - SCRAPE_API_KEY=${SCRAPE_API_KEY}
    ports:
      - "8080:8080"

  cloudflare_tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel run
    depends_on:
      - discord-bot


